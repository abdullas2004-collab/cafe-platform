<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Theme + PWA -->
    <meta name="theme-color" content="#F6F3EC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kaffelog" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Home Screen Icon -->
    <link rel="apple-touch-icon" href="/kaffelog_icon_192.png" />

    <!-- Browser tab favicon -->
    <link rel="icon" type="image/png" href="/kaffelog_icon_192.png" />

    <!-- Fonts: IBM Plex Sans (UI) + IBM Plex Mono (numbers, labels) + Newsreader (money figures) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

    <title>Kaffelog — Daily operations software for UAE cafés</title>
    <meta name="description" content="Daily operations for cafés that actually run. Smart milk orders, Municipality-ready compliance, expiry tracking. Built in the UAE." />

    <!-- Theme initialization — Operations Desk reskin ships light-first;
         dark mode returns after its own design pass (stored preference is preserved) -->
    <script>
      (function() {
        document.documentElement.setAttribute('data-theme', 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#F6F3EC');
      })();
    </script>
  </head>
  <body>
    <style>
      html[data-theme="light"], html[data-theme="light"] body { background: #F6F3EC; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #1E1B18; }
      body { margin: 0; }
    </style>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>

    <!-- Register the service worker for PWA + offline support -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then(reg => console.log("Kaffelog service worker registered"))
            .catch(err => console.warn("Service worker registration failed:", err));
        });
      }
    </script>
  </body>
</html>
