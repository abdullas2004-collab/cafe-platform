<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Theme + PWA -->
    <meta name="theme-color" content="#f5f3ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kaffelog" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Home Screen Icon -->
    <link rel="apple-touch-icon" href="/kaffelog_icon_192.png" />

    <!-- Browser tab favicon -->
    <link rel="icon" type="image/png" href="/kaffelog_icon_192.png" />

    <!-- Fonts: Fraunces (serif headings, editorial weight) + Inter (clean sans body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <title>Kaffelog — Daily operations software for UAE cafés</title>
    <meta name="description" content="Daily operations for cafés that actually run. Smart milk orders, Municipality-ready compliance, expiry tracking. Built in the UAE." />

    <!-- Theme initialization — runs before React renders to prevent flash -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('kaffelog_theme');
          var theme;
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else {
            // Default to system preference
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          // Update theme-color meta dynamically
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#1a1612' : '#f5f3ee');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <style>
      html[data-theme="light"], html[data-theme="light"] body { background: #f5f3ee; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #1a1612; }
      body { margin: 0; }
    </style>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>

    <!-- Register the service worker for PWA + offline support -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then(reg => console.log("Kaffelog service worker registered"))
            .catch(err => console.warn("Service worker registration failed:", err));
        });
      }
    </script>
  </body>
</html>
