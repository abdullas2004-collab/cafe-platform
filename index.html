<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Theme + PWA -->
    <meta name="theme-color" content="#6b4423" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kaffelog" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Home Screen Icon -->
    <link rel="apple-touch-icon" href="/kaffelog_icon_192.png" />

    <!-- Browser tab favicon -->
    <link rel="icon" type="image/png" href="/kaffelog_icon_192.png" />

    <title>Kaffelog — Smart logs for UAE cafés</title>
    <meta name="description" content="Smart compliance & waste reduction for UAE cafés. Be fine-proof. Save AED on every order." />
  </head>
  <body style="margin:0;background:#050d1a;">
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>

    <!-- Register the service worker for PWA + offline support -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then(reg => console.log("Kaffelog service worker registered"))
            .catch(err => console.warn("Service worker registration failed:", err));
        });
      }
    </script>
  </body>
</html>
