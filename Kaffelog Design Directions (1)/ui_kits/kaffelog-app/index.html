<!-- @startingPoint section="Screens" subtitle="Dashboard, milk order, SafeVault, opening checklist" viewport="1280x760" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="./Dashboard.jsx"></script>
<script type="text/babel" src="./MilkOrderScreen.jsx"></script>
<script type="text/babel" src="./SafeVaultScreen.jsx"></script>
<script type="text/babel" src="./ChecklistScreen.jsx"></script>
<div id="root"></div>
<script type="text/babel">
const { Tabs } = window.KaffelogDS;

function App() {
  const [tab, setTab] = React.useState('dashboard');
  const screens = {
    dashboard: <Dashboard />,
    milk: <MilkOrderScreen />,
    safevault: <SafeVaultScreen />,
    checklist: <ChecklistScreen />,
  };
  return (
    <div style={{ background: 'var(--color-bg-page)', minHeight: '100vh', fontFamily: 'var(--font-sans)' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '18px 40px', borderBottom: '1.5px solid var(--brown-900)', background: 'var(--paper-050)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <div style={{ width: 30, height: 30, background: 'var(--brown-900)', display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative' }}>
            <div style={{ width: 13, height: 8, borderRadius: '50%', background: 'var(--paper-100)' }} />
            <div style={{ position: 'absolute', right: 4, bottom: 4, width: 8, height: 8, background: 'var(--rust-400)' }} />
          </div>
          <div style={{ fontWeight: 700, fontSize: 20, letterSpacing: 'var(--tracking-tight)' }}>KAFFELOG</div>
        </div>
        <div className="text-label">MIRDIF BRANCH</div>
      </div>
      <div style={{ padding: '0 40px' }}>
        <Tabs
          items={[
            { value: 'dashboard', label: 'Today' },
            { value: 'milk', label: 'Milk' },
            { value: 'safevault', label: 'SafeVault' },
            { value: 'checklist', label: 'Logs' },
          ]}
          active={tab}
          onChange={setTab}
        />
      </div>
      <div style={{ padding: 40 }}>{screens[tab]}</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
