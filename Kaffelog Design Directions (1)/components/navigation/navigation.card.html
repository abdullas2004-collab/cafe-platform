<div id="root" style="padding:24px; background:var(--color-bg-card);"></div>
<script type="text/babel">
const { Tabs } = window.KaffelogDS;
function Demo() {
  const [active, setActive] = React.useState('today');
  return <Tabs items={[{value:'today',label:'Today'},{value:'milk',label:'Milk'},{value:'logs',label:'Logs'},{value:'safevault',label:'SafeVault'},{value:'reports',label:'Reports'}]} active={active} onChange={setActive} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
