<!-- @dsCard group="Components" viewport="700x320" name="Forms" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:24px; background:var(--color-bg-surface);"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Switch } = window.KaffelogDS;
function Demo() {
  const [checked, setChecked] = React.useState(true);
  const [on, setOn] = React.useState(true);
  return (
    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:20, maxWidth:640}}>
      <Input label="Oat milk" suffix="L" value="12" helperText="Based on 28-day pattern" />
      <Input label="Pest control contract" error="Expires in 3 days" value="" placeholder="Upload renewal" />
      <Select label="Branch" options={[{value:'mirdif', label:'Mirdif'}, {value:'quoz', label:'Al Quoz'}]} value="mirdif" />
      <div style={{display:'flex', flexDirection:'column', gap:14, justifyContent:'center'}}>
        <Checkbox label="Fridge 1 — display chiller" checked={checked} onChange={() => setChecked(!checked)} />
        <Checkbox label="Receiving check — dairy" checked={false} />
        <Switch label="Send WhatsApp report" checked={on} onChange={() => setOn(!on)} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
