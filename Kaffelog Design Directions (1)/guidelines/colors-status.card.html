<!-- @dsCard group="Colors" viewport="700x150" subtitle="SAFE / DUE SOON / NEEDS ATTENTION — fixed vocabulary" name="Status colors" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex; gap:12px; padding:20px; background:var(--color-bg-surface); height:110px; align-items:center; font-family:var(--font-mono);">
  <div style="flex:1; background:var(--color-success-bg); border-left:4px solid var(--color-success-border); padding:14px; font-size:11px; letter-spacing:.1em; color:var(--color-success-text);">SAFE<br><span style="font-size:9px; opacity:.8;">#5C7268</span></div>
  <div style="flex:1; background:var(--color-warning-bg); border-left:4px solid var(--color-warning-border); padding:14px; font-size:11px; letter-spacing:.1em; color:var(--color-warning-text);">DUE SOON<br><span style="font-size:9px; opacity:.8;">#C9762E</span></div>
  <div style="flex:1; background:var(--color-error-bg); border-left:4px solid var(--color-error-border); padding:14px; font-size:11px; letter-spacing:.1em; color:var(--color-error-text);">NEEDS ATTENTION<br><span style="font-size:9px; opacity:.8;">#B03A2E</span></div>
  <div style="flex:1; background:var(--color-neutral-bg); border-left:4px solid var(--color-neutral-border); padding:14px; font-size:11px; letter-spacing:.1em; color:var(--color-neutral-text);">LOGGED<br><span style="font-size:9px; opacity:.8;">#C9C4B8</span></div>
</div>
